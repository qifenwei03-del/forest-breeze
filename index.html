<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      擋搜尋引擎收錄。
      這一行才是真正有效的控制 —— GitHub Pages 的 project site 位於
      <user>.github.io/<repo>/，而爬蟲只讀網域根目錄的 /robots.txt，
      我們放在 public/robots.txt 的那份會落在 /<repo>/robots.txt，爬蟲不會讀到。
    -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Forest Breeze</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      #app {
        position: fixed;
        inset: 0;
        background: #000;
      }

      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ---------- loading / error ---------- */
      #status {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #cfcfcf;
        font-size: 13px;
        line-height: 1.7;
        text-align: center;
        letter-spacing: 0.02em;
        pointer-events: none;
        max-width: 80vw;
      }

      #status.error {
        color: #ff8f7a;
        text-align: left;
        pointer-events: auto;
      }

      #status.hidden {
        display: none;
      }

      /* ---------- weather panel ---------- */
      #weather {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 9;
        width: 340px;
        max-width: calc(100vw - 40px);
        padding: 16px 20px 14px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        /* 毛玻璃。底下是明亮的霧，所以再壓一層極淡的暗色維持文字可讀性 */
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.22),
          rgba(210, 225, 215, 0.14)
        );
        backdrop-filter: blur(22px) saturate(1.25);
        -webkit-backdrop-filter: blur(22px) saturate(1.25);
        box-shadow: 0 8px 32px rgba(20, 35, 25, 0.18);
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC',
          'Microsoft JhengHei', sans-serif;
        text-shadow: 0 1px 3px rgba(20, 35, 25, 0.45);
        line-height: 1.35;
        opacity: 0;
        transition: opacity 0.6s ease;
        pointer-events: none;
        user-select: none;
      }

      #weather.wx-ready {
        opacity: 1;
      }

      #weather .wx-place {
        font-size: 13px;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.92);
      }

      #weather .wx-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-top: 2px;
      }

      #weather .wx-temp {
        font-size: 52px;
        font-weight: 300;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      #weather .wx-cond {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.95);
      }

      #weather .wx-feels {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 12px;
      }

      #weather .wx-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 11px 10px;
      }

      #weather .wx-label {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.72);
        white-space: nowrap;
      }

      #weather .wx-label svg {
        width: 13px;
        height: 13px;
        flex: none;
        opacity: 0.85;
      }

      #weather .wx-value {
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      #weather .wx-sub {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.78);
        margin-left: 5px;
      }

      #weather .wx-status {
        margin-top: 12px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.6);
      }

      #weather .wx-status.wx-error {
        color: #ffcf9a;
      }

      /* 沒有 backdrop-filter 的瀏覽器：加深底色，避免文字糊在亮霧上 */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        #weather {
          background: rgba(38, 52, 44, 0.55);
        }
      }

      @media (max-width: 560px) {
        #weather {
          width: 300px;
          padding: 14px 16px 12px;
        }
        #weather .wx-temp {
          font-size: 44px;
        }
      }

      /* ---------- debug panel ---------- */
      #debug {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        width: 244px;
        color: #e8e8e8;
        font-size: 11px;
        line-height: 1.5;
        background: rgba(8, 10, 9, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        backdrop-filter: blur(6px);
        user-select: none;
      }

      /* 平常隱藏，按 E 顯示 */
      #debug.panel-hidden {
        display: none;
      }

      #debug .dbg-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 9px;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 0.06em;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      #debug.collapsed .dbg-head {
        border-bottom: none;
      }

      #debug .dbg-body {
        padding: 8px 9px 10px;
      }

      #debug.collapsed .dbg-body {
        display: none;
      }

      #debug .row {
        margin-bottom: 8px;
      }

      #debug .row label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 3px;
        color: #b9c3ba;
      }

      #debug .row label b {
        color: #fff;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      #debug input[type='range'] {
        width: 100%;
        margin: 0;
        height: 14px;
        accent-color: #7fd48a;
      }

      #debug select {
        width: 100%;
        font: inherit;
        font-size: 11px;
        color: #e8e8e8;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 4px;
        padding: 3px 4px;
      }

      #debug .checks {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }

      #debug .buttons {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }

      #debug button {
        flex: 1;
        font: inherit;
        font-size: 11px;
        color: #e8e8e8;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 4px;
        padding: 4px 0;
        cursor: pointer;
      }

      #debug button:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      #debug .saved-note {
        color: #7fd48a;
        font-size: 10px;
        min-height: 13px;
        margin-bottom: 6px;
      }

      #debug .saved-note.warn {
        color: #ffb266;
      }

      #debug .info {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 7px;
        color: #9aa79c;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }

      #debug .info div {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      #debug .info span {
        color: #dfe7e0;
      }

      #debug .warn {
        color: #ffb266;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">Loading&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
